<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <!-- ✅ IMPORTANT FOR MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your Responsive CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

    <!-- Translation -->
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<style>
.nav-menu{
    position:fixed;
    top:3px;
    left:10px;
    right:10px;
    z-index:9999;

    background:white;
    padding:8px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

/* button colors */
.nav-btn-main      { background:#007bff; color:white; }
.nav-btn-flow      { background:#ffc107; color:black; }
.nav-btn-monitor   { background:#28a745; color:white; }
.nav-btn-uf        { background:#17a2b8; color:white; }
.nav-btn-ro        { background:#dc3545; color:white; }
.nav-btn-measure   { background:#6c757d; color:white; }
.nav-btn-analysis  { background:#343a40; color:white; }

/* hover */
.nav-menu .btn:hover{
    opacity: 0.85;
}

    /* Responsive buttons */
.btn-group{
    display:flex;
    flex-wrap:wrap;
}

.btn-group .btn{
    flex:1 1 auto;
}
</style>




<!-- LEFT TOP: NAV MENU (HIDE ON MAIN PAGE) -->

{% if request.endpoint != 'main_page' %}
<div class="nav-menu">
    <div class="btn-group gap-1">

        <a href="{{ url_for('main_page') }}" class="btn btn-sm nav-btn-main">Main</a>

        <a href="{{ url_for('flow_diagram') }}" class="btn btn-sm nav-btn-flow">Flow</a>

        <a href="{{ url_for('monitoring') }}" class="btn btn-sm nav-btn-monitor">Monitoring</a>

        <a href="{{ url_for('uf') }}" class="btn btn-sm nav-btn-uf">UF</a>

        <a href="{{ url_for('ro') }}" class="btn btn-sm nav-btn-ro">RO</a>

        <a href="{{ url_for('measurement') }}" class="btn btn-sm nav-btn-measure">Measure</a>

        <a href="{{ url_for('analysis') }}" class="btn btn-sm nav-btn-analysis">Analysis</a>

    </div>
</div>
{% endif %}



<!-- 🔥 REQUIRED CONTENT BLOCK -->
<div style="margin-top:60px;">
    {% block content %}{% endblock %}
</div>



</body>
</html>
