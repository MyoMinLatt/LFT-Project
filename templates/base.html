<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const buttons = document.querySelectorAll(".nav-menu a");
    const currentPath = window.location.pathname;

    buttons.forEach(function (btn) {

        // 1. Set active based on URL (page load)
        if (btn.getAttribute("href") === currentPath) {
            btn.classList.add("active");
        }

        // 2. Add click behavior (instant UI feedback)
        btn.addEventListener("click", function () {
            buttons.forEach(b => b.classList.remove("active"));
            this.classList.add("active");
        });

    });

});

</script>

<body>

<style>
.nav-menu{
    position: fixed;
    top: 3px;
    left: 20px;
    z-index: 20000;

    background: #D8D4BC;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* button colors */
.nav-btn-main      { background:#304C53; color:white; }
.nav-btn-flow      { background:#304C53; color:white; }
.nav-btn-monitor   { background:#304C53; color:white; }
.nav-btn-uf        { background:#304C53; color:white; }
.nav-btn-ro        { background:#304C53; color:white; }
.nav-btn-manual   { background:#304C53; color:white; }
.nav-btn-analysis  { background:#304C53; color:white; }

/* hover */
.nav-menu .btn:hover{
    opacity: 0.85;
}

/* ACTIVE COLORS (clicked state) */
.nav-btn-main.active {background: #0000ff;}
.nav-btn-flow.active {background: #0000ff;}
.nav-btn-monitor.active {background: #0000ff;}
.nav-btn-uf.active {background: #0000ff;}
.nav-btn-ro.active {background: #0000ff;}
.nav-btn-manual.active {background: #0000ff;}
.nav-btn-analysis.active {background: #0000ff;}

    .nav-menu .btn.active {
    color: white;
    transform: scale(1.05);
    box-shadow: 0 0 6px rgba(0,0,0,0.3);
}
</style>




<!-- LEFT TOP: NAV MENU (HIDE ON MAIN PAGE) -->

{% if request.endpoint != 'main_page' %}
<div class="nav-menu">
    <div class="btn-group gap-1">

        <a href="{{ url_for('main_page') }}" class="btn btn-sm nav-btn-main">Main</a>

        <a href="{{ url_for('flow_diagram') }}" class="btn btn-sm nav-btn-flow">Flow</a>

        <a href="{{ url_for('monitoring') }}" class="btn btn-sm nav-btn-monitor">Monitoring</a>

        <a href="{{ url_for('uf') }}" class="btn btn-sm nav-btn-uf">UF</a>

        <a href="{{ url_for('ro') }}" class="btn btn-sm nav-btn-ro">RO</a>

        <a href="{{ url_for('manual') }}" class="btn btn-sm nav-btn-manual">Manual</a>

        <a href="{{ url_for('analysis') }}" class="btn btn-sm nav-btn-analysis">Analysis</a>

    </div>
</div>
{% endif %}



<!-- REQUIRED CONTENT BLOCK -->
<div style="margin-top:60px;">
    {% block content %}{% endblock %}
</div>



</body>
</html>
