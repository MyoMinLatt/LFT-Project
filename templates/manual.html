{% extends "base.html" %}

{% block title %}Manual of Measurements{% endblock %}

{% block content %}

<style>

/* ===============================
   BASE
=============================== */
body {
    background:#848B79;
    color:white;
}

/* ===============================
   TEXT BOX
=============================== */
.text-box {
    background:white;
    padding:15px;
    border-radius:8px;
    min-height:150px;
    position:relative;
}

.text-box h3{
    color:black;
    margin-bottom:10px;
}

.text-box p{
    color:black;
    margin:0;
    line-height:1.8;      /* spacing between lines */
    margin-bottom:20px;   /* spacing between paragraphs */
}

/* ===============================
   BUTLLET & NUMBERING
=============================== */
.text-box ul{
    margin-left:20px;
    margin-bottom:20px;
}

.text-box li{
    margin-bottom:12px;
    line-height:1.8;
    color:black;
}

.custom-bullets{
    margin-left:25px;
    line-height:1.8;
}

/* Different bullet styles */
.custom-bullets{

    list-style-type:square;      /* other options: disc, circle, square, none */
}

.custom-bullets li{
    margin-bottom:12px;
}




/* ===============================
   TOP PANEL
=============================== */
.manual-top-panel{
    position: fixed;
    top: 55px;
    left: 0;
    width: 100%;
    z-index: 9999;

    background: #555D50;
    padding: 10px 20px;

    display: flex;
    flex-direction: column;
    gap: 3px;
}

.manual-title{
    text-align: center;
    font-size: 40px;
    margin: 0;
}

.manual-top-panel select{
    position: absolute;
    top: 10px;
    right: 20px;
    width: 120px;
}

/* ===============================
   TIME BOX
=============================== */
.time-box{
    margin-top:10px;
    font-size:16px;
    line-height:1.5;
}

/* ===============================
   CONTENT
=============================== */
.manual-content{
    margin-top: 170px;
}

.param-panel{
    max-width: 250px;
    padding-right: 10px;
}

/* ===============================
   PARAMETER BUTTONS
=============================== */
.parameter-btn {
    width:100%;
    margin-bottom:6px;
    padding: 8px;
    font-size: 14px;
    background-color:#004225 !important;
    color:#ffffff !important;
    border:2px solid #22CE83 !important;
}

.parameter-btn:hover {
    background-color:#3c096c !important;
}

/* ===============================
   DEVICE BUTTONS
=============================== */
.device-btn {
    width:100%;
    margin-bottom:4px;
    background-color:#348781 !important;
    color:white !important;
    border:2px solid #01F9C6 !important;
}

.device-btn:hover {
    background-color:#033E3E !important;
}

/* ===============================
   ACTIVE DEVICE BUTTON
=============================== */
.device-btn.active-device{

    background-color:#240046 !important;

    color:#ffffff !important;

    border:2px solid #ffffff !important;

    box-shadow:0 0 10px #00ffff;
}

/* ===============================
   TEXT PANEL
=============================== */
.text-panel{
    padding-left:10px;
}

 /* ===============================
   ADJUST IMAGES
=============================== */
    .manual-img{
    width:100%;
    height:250px;
    object-fit:contain;

    border-radius:8px;
    border:1px solid #ccc;
}

/* ===============================
   INFO TABLE (NO BORDER)
=============================== */
.info-table{
    border-collapse: collapse;
    color:black;
}

.info-table td{
    border:none !important;
    padding:5px 12px 5px 0;
    vertical-align:top;
}

.label-col{
    width:200px;
}

/* ===============================
   IMAGE LABELS
=============================== */
/* ===============================
   MAIN DIAGRAM CONTAINER
=============================== */
.diagram-container{
    position:relative;
    display:inline-block;
    width:100%;
    max-width:1000px;
    overflow:visible;
}

/* ===============================
   IMAGE LAYER
=============================== */
.image-layer{
    position:relative;
    z-index:1;
}

/* ===============================
   MAIN IMAGE
=============================== */
.main-image{
    width:100%;
    border-radius:8px;
    border:1px solid #ccc;
}

/* ===============================
   ANNOTATION LAYER
=============================== */
.annotation-layer{

    position:absolute;
    top:-200px;
    left:-250px;

    width:calc(100% + 500px);
    height:calc(100% + 400px);

    z-index:10;
    pointer-events:none;
    overflow:visible;
}

/* ===============================
   LABEL BOX
=============================== */
.label-box{

    position:absolute;
    background:yellow;
    color:black;
    padding:6px 10px;
    font-size:14px;
    font-weight:bold;
    border-radius:6px;
    border:1px solid black;
    box-shadow:2px 2px 6px rgba(0,0,0,0.3);
}

/* ===============================
   COMMON ARROW STYLE
=============================== */
.arrow{

    position:absolute;

    height:3px;

    background:red;

    transform-origin:left center;
}

/* ===============================
   COMMON ARROW HEAD
=============================== */
.arrow::after{

    content:"";

    position:absolute;

    right:-8px;

    top:-4px;

    border-left:10px solid red;

    border-top:5px solid transparent;

    border-bottom:5px solid transparent;
}

/* =====================================================
   LABEL 1 : PARAMETERS
===================================================== */
.label-1{
    top:320px;
    left:140px;
}

/* ARROW 1 */
.arrow-1{
    top:330px;
    left:215px;
    width:275px;
    transform:rotate(-2deg);
}

/* ARROW 2 */
.arrow-2{
    top:330px;
    left:215px;
    width:275px;
    transform:rotate(8deg);
}

/* =====================================================
   LABEL 2 : DEVICES
===================================================== */
.label-2{
    top:550px;
    left:120px;
}

/* ARROW 3 */
.arrow-3{
    top:560px;
    left:215px;
    width:137px;
    transform:rotate(-40deg);
}

/* ARROW 4 */
.arrow-4{
    top:560px;
    left:215px;
    width:160px;
    transform:rotate(45deg);
}

/* =====================================================
   LABEL 3 : LATEST VALUES
===================================================== */
.label-3{
    top:550px;
    right:120px;
}

/* ARROW 5 */
.arrow-5{
    top:565px;
    right:-190px;
    width:420px;
    transform:rotate(172deg);
}

/* ARROW 6 */
.arrow-6{
    top:565px;
    right:110px;
    width:120px;
    transform:rotate(225deg);
}


/* =====================================================
   LABEL 4 : Pumps
===================================================== */
.label-4{
    top:500px;
    left:140px;
}

/* ARROW 7 */
.arrow-7{
    top:510px;
    left:210px;
    width:200px;
    transform:rotate(-2deg);
}

/* ARROW 8 */
.arrow-8{
    top:510px;
    left:210px;
    width:215px;
    transform:rotate(25deg);
}

/* =====================================================
   LABEL 5 : Pump VALUES
===================================================== */
.label-5{
    top:750px;
    right:120px;
}

/* ARROW 9 */
.arrow-9{
    top:765px;
    right:-300px;
    width:530px;
    transform:rotate(173deg);
}

/* ARROW 10 */
.arrow-10{
    top:765px;
    right:-10px;
    width:240px;
    transform:rotate(210deg);
}

/* =================================
   IMAGE WRAPPER
================================= */
.img-wrapper{
    position:relative;
    display:inline-block;
}

/* =================================
   ANNOTATION LAYER
================================= */
.annotation-layer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* =================================
   EMPTY RECTANGLE BOX
================================= */
.highlight-box{
    position:absolute;
    border:4px solid red;
    background:transparent;
}

/* =================================
   BOX POSITION
================================= */
.box-1{
    top:200px;      /* move down */
    left:130px;    /* move right */
    width:300px;   /* rectangle width */
    height:60px;   /* rectangle height */
}

.box-2{
    top:10px;      /* move down */
    left:130px;    /* move right */
    width:300px;   /* rectangle width */
    height:60px;   /* rectangle height */
}


/* =================================
   COMMON POINTED ARROW STYLE
================================= */
.arrow-line{
    position:absolute;
    height:4px;
    background:red;
    transform-origin:left center;
}

/* =================================
   ARROW HEAD
================================= */
.arrow-line::after{
    content:"";
    position:absolute;
    right:-10px;
    top:-4px;
    border-left:12px solid red;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

/* =================================
   START DATE ARROW
================================= */
.arrow-start{
    top:300px;       /* up/down */
    left:90px;      /* left/right */
    width:90px;    /* arrow length */
    transform:rotate(270deg);
    background:blue;
}

/* arrow head color */
.arrow-start::after{
    border-left-color:blue;
}

/* =================================
   END DATE ARROW
================================= */
.arrow-end{

    top:300px;
    left:400px;
    width:90px;
    transform:rotate(270deg);
    background:red;
}

/* arrow head color */
.arrow-end::after{
    border-left-color:red;
}


/* ===============================
   IMAGE CAPTION
=============================== */
.figure-caption{

    margin-top:15px;
    font-size:16px;
    font-weight:bold;
    color:black;
    text-align:center;
}


/* ===============================
   CLOSE BUTTON
=============================== */
.close-box{

    position:absolute;
    top:8px;
    right:12px;
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:#cc0000;
    color:white;
    font-size:20px;
    font-weight:bold;
    line-height:24px;
    cursor:pointer;
    z-index:999;
}

/* HOVER */
.close-box:hover{

    background:#ff0000;
}

</style>

=============================== -->

<script>

$(document).ready(function(){

/* ===============================
   DEVICE MAP
=============================== */
const deviceMap = {

    "Language Switcher": [
        {
        label: "Languages",
        file: "languages"
        }
    ],

    "Flow Diagram Page": [
        {
            label: "Measurable Devices",
            file: "devices"
        },

        {
            label: "Pumps",
            file: "pumps"
        },

        {
        label: "Automatic Control Valves",
        file: "flow_valves"
        },

        {
        label: "Calendar",
        file: "flow_calendar"
        },

        {
        label: "Customized Date & Times",
        file: "flow_custom"
        },

        {
        label: "1st Key-value Table",
        file: "flow_table1"
        },

        {
        label: "2nd Key value Table",
        file:   "flow_table2"
        },

        {
        label: "Animated Logic",
        file:   "flow_animation"
        }
    ],

    "Monitoring Page": [
        {
        label: "Devices Status",
        file:   "moni_devices"
        },

        {
        label: "Pump Status",
        file:   "moni_pumps"
        },

        {
        label: "Valve Status",
        file:   "moni_valve"
        },

        {
        label: "Thresholds",
        file:   "moni_thresholds"
        },

        {
        label: "Counts & Alarm Toggle",
        file:   "moni_alarm"
        }
    ],

    "UF & RO System Pages": [
        {
        label: "Parameter Buttons",
        file:   "system_parameters"
        },

        {
        label: "Graphs",
        file:   "system_graphs"
        },

        {
        label: "Key-value Tables",
        file:   "system_table"
        },

        {
        label: "Threshold Boxes",
        file:   "system_threshold"
        },

        {
        label: "Time Interval Options",
        file:   "system_time_interval"
        },

        {
        label: "Custom Range",
        file:   "system_range"
        },

        {
        label: "Valve Status",
        file:   "system_valves"
        }

    ],

    "Analysis Page": [
        {
        label: "Variable Options",
        file:   "analysis_variables"
        },

        {
        label: "Time Interval Options",
        file:   "analysis_interval"
        },

        {
        label: "Custom Range",
        file:   "analysis_range"
        },

        {
        label: "Statistical Models",
        file:   "analysis_models"
        },

        {
        label: "Input Browser",
        file:   "analysis_input"
        },

        {
        label: "Summary Table",
        file:   "analysis_summary"
        },

        {
        label: "Result Plots",
        file:   "analysis_plots"
        }

    ]

};

/* ===============================
   SAFE ID
=============================== */
function safeId(name){

    return name
        .replace(/\s+/g,"_")
        .replace(/[^\w]/g,"");

}

/* ===============================
   PARAMETER BUTTON CLICK
=============================== */
$(".parameter-btn").click(function(){

    let param = $(this).data("param");

    let container = $(this).next(".device-container");

    /* TOGGLE DEVICE BUTTONS */
    if(container.children().length > 0){

        container.empty();

        return;
    }

    /* CHECK MAP */
    if(!deviceMap[param]){

        console.warn("No mapping:", param);

        return;
    }

    /* ADD DEVICE BUTTONS */
    deviceMap[param].forEach(function(d){

    container.append(`
        <button class="btn btn-secondary device-btn"
                data-device="${d.label}"
                data-file="${d.file}">
            ${d.label}
        </button>
    `);

});

});

/* ===============================
   DEVICE BUTTON CLICK
=============================== */
/* ===============================
   DEVICE BUTTON CLICK
=============================== */
$(document).on("click",".device-btn",function(){

    const btn = $(this);

    const device = btn.data("device");

    const file = btn.data("file");

    const deviceId = safeId(device);

    /* TOGGLE OFF */
    if($("#box_" + deviceId).length){

        $("#box_" + deviceId).remove();

        /* REMOVE ACTIVE COLOR */
        btn.removeClass("active-device");

        return;
    }

    /* ACTIVE COLOR */
    btn.addClass("active-device");

    /* CREATE CONTAINER */
    $("#text-container").append(`

        <div class="col-md-12"
             id="box_${deviceId}">

            <div class="text-box">

                <!-- CLOSE BUTTON -->
                <button class="close-box"
                        data-target="box_${deviceId}">
                    ×
                </button>

                <div id="content_${deviceId}">
                    Loading...
                </div>

            </div>

        </div>

    `);

    /* LOAD HTML FILE */
    $("#content_" + deviceId).load(
    "/manuals/" + file
    );

});

/* ===============================
   CLOSE CONTAINER
=============================== */
$(document).on("click",".close-box",function(){

    const target = $(this).data("target");

    /* FIND DEVICE ID */
    const deviceId = target.replace("box_","");

    /* REMOVE CONTAINER */
    $("#" + target).remove();

    /* REMOVE ACTIVE COLOR FROM BUTTON */
    $(".device-btn").each(function(){

        const btnDevice = safeId($(this).data("device"));

        if(btnDevice === deviceId){

            $(this).removeClass("active-device");
        }

    });

});

/* ===============================
   CLOCK
=============================== */
function updateTimes(){

    const now = new Date();

    /* UTC */
    $("#utc-time").text(
        now.toISOString()
           .slice(0,19)
           .replace("T"," ")
    );

    /* KST */
    const kst = new Date(
        now.getTime() + 9*60*60*1000
    );

    $("#kst-time").text(
        kst.toISOString()
           .slice(0,19)
           .replace("T"," ")
    );

}

/* RUN CLOCK */
setInterval(updateTimes,1000);

updateTimes();

}); // END document.ready

</script>
