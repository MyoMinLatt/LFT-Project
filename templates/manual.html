{% extends "base.html" %}

{% block title %}Manual of Measurements{% endblock %}

{% block content %}

<style>

/* ===============================
   BASE
=============================== */
body {
    background:#848B79;
    color:white;
}

/* ===============================
   TEXT BOX
=============================== */
.text-box {
    background:white;
    padding:15px;
    border-radius:8px;
    min-height:150px;
    position:relative;
}

.text-box h3{
    color:black;
    margin-bottom:10px;
}

.text-box p{
    color:black;
    margin:0;
    line-height:1.8;      /* spacing between lines */
    margin-bottom:20px;   /* spacing between paragraphs */
}

/* ===============================
   BUTLLET & NUMBERING
=============================== */
.text-box ul{
    margin-left:20px;
    margin-bottom:20px;
}

.text-box li{
    margin-bottom:12px;
    line-height:1.8;
    color:black;
}

.custom-bullets{
    margin-left:25px;
    line-height:1.8;
}

/* Different bullet styles */
.custom-bullets{

    list-style-type:square;      /* other options: disc, circle, square, none */
}

.custom-bullets li{
    margin-bottom:12px;
}




/* ===============================
   TOP PANEL
=============================== */
.manual-top-panel{
    position: fixed;
    top: 0px;
    left: 0;
    width: 100%;
    z-index: 9999;

    background: #555D50;
    padding: 10px 20px;

    display: flex;
    flex-direction: column;
    gap: 3px;
}

.manual-title{
    text-align: center;
    font-size: 40px;
    margin: 0;
}

.manual-top-panel select{
    position: absolute;
    top: 10px;
    right: 20px;
    width: 120px;
}

/* ===============================
   TIME BOX
=============================== */
.time-box{
    margin-top:10px;
    font-size:16px;
    line-height:1.5;
}

/* ===============================
   CONTENT
=============================== */
.manual-content{
    margin-top: 170px;
}

.param-panel{
    position:fixed;
    top:200px;          /* below top panel */
    left:15px;
    width:250px;
    max-width:250px;
    height:calc(100vh - 160px);
    overflow-y:auto;
    padding-right:10px;
    z-index:1000;
}

/* ===============================
   PARAMETER BUTTONS
=============================== */
.parameter-btn {
    width:100%;
    margin-bottom:6px;
    padding: 8px;
    font-size: 14px;
    background-color:#004225 !important;
    color:#ffffff !important;
    border:2px solid #22CE83 !important;
}

.parameter-btn:hover {
    background-color:#3c096c !important;
}

/* ===============================
   DEVICE BUTTONS
=============================== */
.device-btn {
    width:100%;
    margin-bottom:4px;
    background-color:#348781 !important;
    color:white !important;
    border:2px solid #01F9C6 !important;
}

.device-btn:hover {
    background-color:#033E3E !important;
}

/* ===============================
   ACTIVE DEVICE BUTTON
=============================== */
.device-btn.active-device{

    background-color:#240046 !important;

    color:#ffffff !important;

    border:2px solid #ffffff !important;

    box-shadow:0 0 10px #00ffff;
}

/* ===============================
   TEXT PANEL
=============================== */
.text-panel{
    margin-left:270px;   /* leave room for fixed panel */
    padding-left:15px;
}

 /* ===============================
   ADJUST IMAGES
=============================== */
    .manual-img{
    width:100%;
    height:250px;
    object-fit:contain;

    border-radius:8px;
    border:1px solid #ccc;
}

/* ===============================
   INFO TABLE (NO BORDER)
=============================== */
.info-table{
    border-collapse: collapse;
    color:black;
}

.info-table td{
    border:none !important;
    padding:5px 12px 5px 0;
    vertical-align:top;
}

.label-col{
    width:200px;
}

/* ===============================
   IMAGE LABELS
=============================== */
/* ===============================
   MAIN DIAGRAM CONTAINER
=============================== */
.diagram-container{
    position:relative;
    display:inline-block;
    width:100%;
    max-width:1000px;
    overflow:visible;
}

/* ===============================
   IMAGE LAYER
=============================== */
.image-layer{
    position:relative;
    z-index:1;
}

/* ===============================
   MAIN IMAGE
=============================== */
.main-image{
    width:100%;
    border-radius:8px;
    border:1px solid #ccc;
}

/* ===============================
   ANNOTATION LAYER
=============================== */
.annotation-layer{

    position:absolute;
    top:-200px;
    left:-250px;

    width:calc(100% + 500px);
    height:calc(100% + 400px);

    z-index:10;
    pointer-events:none;
    overflow:visible;
}

/* ===============================
   LABEL BOX
=============================== */
.label-box{

    position:absolute;
    background:yellow;
    color:black;
    padding:6px 10px;
    font-size:14px;
    font-weight:bold;
    border-radius:6px;
    border:1px solid black;
    box-shadow:2px 2px 6px rgba(0,0,0,0.3);
}

/* ===============================
   COMMON ARROW STYLE
=============================== */
.arrow{

    position:absolute;

    height:3px;

    background:red;

    transform-origin:left center;
}

/* ===============================
   COMMON ARROW HEAD
=============================== */
.arrow::after{
    content:"";
    position:absolute;
    right:-8px;
    top:-4px;
    border-left:10px solid red;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
}

/* =====================================================
   LABEL 1 : PARAMETERS
===================================================== */
.label-1{
    top:140px;
    left:-65px;
}

/* ARROW 1 */
.arrow-1{
    top:150px;
    left:5px;
    width:240px;
    transform:rotate(-6deg);
}

/* ARROW 2 */
.arrow-2{
    top:150px;
    left:5px;
    width:240px;
    transform:rotate(5deg);
}

/* =====================================================
   LABEL 2 : DEVICES
===================================================== */
.label-2{
    top:300px;
    left:-110px;
}

/* ARROW 3 */
.arrow-3{
    top:310px;
    left:5px;
    width:80px;
    transform:rotate(-35deg);
}

/* ARROW 4 */
.arrow-4{
    top:310px;
    left:5px;
    width:180px;
    transform:rotate(60deg);
}

/* =====================================================
   LABEL 3 : LATEST VALUES
===================================================== */
.label-3{
    top:350px;
    right:-100px;
}

/* ARROW 5 */
.arrow-5{
    top:360px;
    right:-400px;
    width:400px;
    transform:rotate(172deg);
}

/* ARROW 6 */
.arrow-6{
    top:360px;
    right:-120px;
    width:120px;
    transform:rotate(225deg);
}


/* =====================================================
   LABEL 4 : Pumps
===================================================== */
.label-4{
    top:500px;
    left:-80px;
}

/* ARROW 7 */
.arrow-7{
    top:510px;
    left:-5px;
    width:160px;
    transform:rotate(-2deg);
}

/* ARROW 8 */
.arrow-8{
    top:510px;
    left:-5px;
    width:200px;
    transform:rotate(30deg);
}

/* =====================================================
   LABEL 5 : Pump VALUES
===================================================== */
.label-5{
    top:550px;
    right:-120px;
}

/* ARROW 9 */
.arrow-9{
    top:560px;
    right:-510px;
    width:500px;
    transform:rotate(173deg);
}

/* ARROW 10 */
.arrow-10{
    top:560px;
    right:-250px;
    width:240px;
    transform:rotate(210deg);
}

/* =================================
   IMAGE WRAPPER
================================= */
.img-wrapper{
    position:relative;
    display:inline-block;
}

/* =================================
   ANNOTATION LAYER
================================= */
.annotation-layer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* =================================
   EMPTY RECTANGLE BOX
================================= */
.highlight-box{
    position:absolute;
    border:4px solid red;
    background:transparent;
}

/* =================================
   BOX POSITION
================================= */
.box-1{
    top:200px;      /* move down */
    left:130px;    /* move right */
    width:300px;   /* rectangle width */
    height:60px;   /* rectangle height */
}

.box-2{
    top:10px;      /* move down */
    left:130px;    /* move right */
    width:300px;   /* rectangle width */
    height:60px;   /* rectangle height */
}


/* =================================
   COMMON POINTED ARROW STYLE
================================= */
.arrow-line{
    position:absolute;
    height:4px;
    background:red;
    transform-origin:left center;
}

/* =================================
   ARROW HEAD
================================= */
.arrow-line::after{
    content:"";
    position:absolute;
    right:-10px;
    top:-4px;
    border-left:12px solid red;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

/* =================================
   START DATE ARROW
================================= */
.arrow-start{
    top:300px;       /* up/down */
    left:90px;      /* left/right */
    width:90px;    /* arrow length */
    transform:rotate(270deg);
    background:blue;
}

/* arrow head color */
.arrow-start::after{
    border-left-color:blue;
}

/* =================================
   END DATE ARROW
================================= */
.arrow-end{

    top:300px;
    left:400px;
    width:90px;
    transform:rotate(270deg);
    background:red;
}

/* arrow head color */
.arrow-end::after{
    border-left-color:red;
}


/* ===============================
   IMAGE CAPTION
=============================== */
.figure-caption{

    margin-top:15px;
    font-size:16px;
    font-weight:bold;
    color:black;
    text-align:center;
}


/* ===============================
   CLOSE BUTTON
=============================== */
.close-box{

    position:absolute;
    top:8px;
    right:12px;
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:#cc0000;
    color:white;
    font-size:20px;
    font-weight:bold;
    line-height:24px;
    cursor:pointer;
    z-index:999;
}

/* HOVER */
.close-box:hover{

    background:#ff0000;
}

</style>

<!-- ===============================
     TOP PANEL
=============================== -->
<div class="manual-top-panel">

    <h2 class="manual-title"
        data-i18n="manual_measurement">
        Manual of Measurement
    </h2>

    <!-- LANGUAGE -->
    <select id="languageSwitcher">
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="my">Myanmar</option>
        <option value="vi">Vietnamese</option>
        <option value="mn">Mongolian</option>
    </select>
<!-- GOOGLE TRANSLATE -->
#<div id="google_translate_element"></div>   */if Google translator is applied


    <!-- TIME -->
    <div class="time-box">

        <div>
            UTC:
            <span id="utc-time"></span>
        </div>

        <div>
            KST:
            <span id="kst-time"></span>
        </div>

    </div>

</div>

<hr style="border-color:white;">

<!-- ===============================
     MAIN CONTENT
=============================== -->
<div class="row manual-content">

    <!-- ===============================
         PARAMETER PANEL
    =============================== -->
    <div class="col-md-3 param-panel">

        <button class="btn btn-primary parameter-btn"
                data-param="Language Switcher"
                data-i18n="manual_language_switcher">
            Language Switcher
        </button>
        <div class="device-container"></div>

        <button class="btn btn-primary parameter-btn"
                data-param="Flow Diagram Page"
                data-i18n="manual_flow_page">
            Flow Diagram Page
        </button>
        <div class="device-container"></div>

        <button class="btn btn-primary parameter-btn"
                data-param="Monitoring Page"
                data-i18n="manual_monitoring_page">
            Monitoring Page
        </button>
        <div class="device-container"></div>

        <button class="btn btn-primary parameter-btn"
                data-param="UF & RO System Pages"
                data-i18n="manual_system_pages">
            UF & RO System Pages
        </button>
        <div class="device-container"></div>

        <button class="btn btn-primary parameter-btn"
                data-param="Analysis Page"
                data-i18n="manual_analysis_page">
            Analysis Page
        </button>
        <div class="device-container"></div>

    </div>

    <!-- ===============================
         TEXT PANEL
    =============================== -->
    <div class="col-md-9 text-panel">

        <div class="row g-3" id="text-container"></div>

    </div>

</div>

<script>

$(document).ready(function(){

/* ===============================
   PAGE TRANSLATION
=============================== */
function translatePage(lang){

    $("[data-i18n]").each(function(){

        const key =
            $(this).data("i18n");

        $(this).html(
            translations[lang][key] || key
        );

    });

}

/* ===============================
   LANGUAGE SWITCHER
=============================== */
$("#languageSwitcher").change(function(){

    const lang = $(this).val();

    /* translate page title + parameter buttons */
    translatePage(lang);

    /* translate device buttons */
    $(".device-btn").each(function(){

        const btn = $(this);

        const key =
            btn.data("device");

        btn.html(
            translations[lang][key] || key
        );

    });

    /* reload opened manuals */
    $(".device-btn.active-device").each(function(){

        const btn = $(this);

        const device =
            btn.data("device");

        const file =
            btn.data("file");

        const deviceId =
            safeId(device);

        $("#content_" + deviceId).load(
            "/manuals/" +
            file +
            "?lang=" +
            lang
        );

    });

});

/* initial translation when page loads */
translatePage(
    $("#languageSwitcher").val() || "en"
);
/* ===============================
   DEVICE MAP
=============================== */
const deviceMap = {

"Language Switcher":[
    {
        labelKey:"manual_languages",
        file:"languages"
    }
],

"Flow Diagram Page":[
    {
        labelKey:"manual_devices",
        file:"devices"
    },
    {
        labelKey:"manual_pumps",
        file:"pumps"
    },
    {
        labelKey:"manual_auto_valves",
        file:"flow_valves"
    },
    {
        labelKey:"manual_calendar",
        file:"flow_calendar"
    },
    {
        labelKey:"manual_custom_datetime",
        file:"flow_custom"
    },
    {
        labelKey:"manual_table1",
        file:"flow_table1"
    },
    {
        labelKey:"manual_table2",
        file:"flow_table2"
    },
    {
        labelKey:"manual_animation",
        file:"flow_animation"
    }
],

"Monitoring Page":[
    {
        labelKey:"manual_devices_status",
        file:"moni_devices"
    },
    {
        labelKey:"manual_pump_status",
        file:"moni_pumps"
    },
    {
        labelKey:"manual_valve_status",
        file:"moni_valve"
    },
    {
        labelKey:"manual_thresholds",
        file:"moni_thresholds"
    },
    {
        labelKey:"manual_alarm_toggle",
        file:"moni_alarm"
    }
],

"UF & RO System Pages":[
    {
        labelKey:"manual_parameter_buttons",
        file:"system_parameters"
    },
    {
        labelKey:"manual_graphs",
        file:"system_graphs"
    },
    {
        labelKey:"manual_key_tables",
        file:"system_table"
    },
    {
        labelKey:"manual_threshold_boxes",
        file:"system_threshold"
    },
    {
        labelKey:"manual_time_options",
        file:"system_time_interval"
    },
    {
        labelKey:"manual_custom_range",
        file:"system_range"
    },
    {
        labelKey:"manual_valve_status",
        file:"system_valves"
    }
],

"Analysis Page":[
    {
        labelKey:"manual_variable_options",
        file:"analysis_variables"
    },
    {
        labelKey:"manual_time_options",
        file:"analysis_interval"
    },
    {
        labelKey:"manual_custom_range",
        file:"analysis_range"
    },
    {
        labelKey:"manual_models",
        file:"analysis_models"
    },
    {
        labelKey:"manual_input_browser",
        file:"analysis_input"
    },
    {
        labelKey:"manual_summary_table",
        file:"analysis_summary"
    },
    {
        labelKey:"manual_result_plots",
        file:"analysis_plots"
    }
]

};

/* ===============================
   SAFE ID
=============================== */
function safeId(name){

    return name
        .replace(/\s+/g,"_")
        .replace(/[^\w]/g,"");

}

/* ===============================
   PARAMETER BUTTON CLICK
=============================== */
$(document).on(
    "click",
    ".parameter-btn",
    function(){

    let param = $(this).data("param");

    let container = $(this).next(".device-container");

    /* TOGGLE DEVICE BUTTONS */
    if(container.children().length > 0){

        container.empty();

        return;
    }

    /* CHECK MAP */
    if(!deviceMap[param]){

        console.warn("No mapping:", param);

        return;
    }

    /* ADD DEVICE BUTTONS */
deviceMap[param].forEach(function(d){

    const lang =
        $("#languageSwitcher").val() || "en";

    const text =
        translations[lang][d.labelKey] ||
        d.labelKey;

    container.append(`
        <button class="btn btn-secondary device-btn"
                data-device="${d.labelKey}"
                data-file="${d.file}">
            ${text}
        </button>
    `);

});

});


/* ===============================
   DEVICE BUTTON CLICK
=============================== */
$(document).on("click",".device-btn",function(){

    const btn = $(this);

    const device = btn.data("device");

    const file = btn.data("file");

    const deviceId = safeId(device);

    /* TOGGLE OFF */
    if($("#box_" + deviceId).length){

        $("#box_" + deviceId).remove();

        /* REMOVE ACTIVE COLOR */
        btn.removeClass("active-device");

        return;
    }

    /* ACTIVE COLOR */
    btn.addClass("active-device");

    /* CREATE CONTAINER */
    $("#text-container").append(`

        <div class="col-md-12"
             id="box_${deviceId}">

            <div class="text-box">

                <!-- CLOSE BUTTON -->
                <button class="close-box"
                        data-target="box_${deviceId}">
                    ×
                </button>

                <div id="content_${deviceId}">
                    Loading...
                </div>

            </div>

        </div>

    `);

    /* LOAD HTML FILE WITH LANGUAGE */
const lang =
    $("#languageSwitcher").val() || "en";

$("#content_" + deviceId).load(
    "/manuals/" +
    file +
    "?lang=" +
    lang
);

});

/* ===============================
   CLOSE CONTAINER
=============================== */
$(document).on("click",".close-box",function(){

    const target = $(this).data("target");

    /* FIND DEVICE ID */
    const deviceId = target.replace("box_","");

    /* REMOVE CONTAINER */
    $("#" + target).remove();

    /* REMOVE ACTIVE COLOR FROM BUTTON */
    $(".device-btn").each(function(){

        const btnDevice = safeId($(this).data("device"));

        if(btnDevice === deviceId){

            $(this).removeClass("active-device");
        }

    });

});

/* ===============================
   CLOCK
=============================== */
function updateTimes(){

    const now = new Date();

    /* UTC */
    $("#utc-time").text(
        now.toISOString()
           .slice(0,19)
           .replace("T"," ")
    );

    /* KST */
    const kst = new Date(
        now.getTime() + 9*60*60*1000
    );

    $("#kst-time").text(
        kst.toISOString()
           .slice(0,19)
           .replace("T"," ")
    );

}

/* RUN CLOCK */
setInterval(updateTimes,1000);

updateTimes();

}); // END document.ready

</script>
