/* =========================
BASE DEVICE STYLE
========================= */

/* Valve base */
.valve{
stroke:black;
stroke-width:2;
fill:#666;
cursor:pointer;
transition:all 0.3s;
}

/* Pump base */
.pump{
stroke:black;
stroke-width:2;
fill:#666;
cursor:pointer;
transition:all 0.3s;
}


/* =========================
BLINK ANIMATION
========================= */

@keyframes blink{

0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}

}


/* =========================
VALVE STATUS
========================= */

/* ON → green blinking */
.valve-on{
fill:#00ff00;
animation:blink 1s infinite;
}

/* OFF → red */
.valve-off{
fill:#ff0000;
animation:blink 1s infinite;
}

/* ERROR → orange blinking */
.valve-error{
fill:orange;
animation:blink 0.7s infinite;
}


/* =========================
PUMP STATUS
========================= */

/* base pump appearance */
.pump circle{
stroke:black;
stroke-width:2;
fill:#666;
}

/* Pump running */
.pump-on circle{
fill:#00ff00;
animation:blink 1s infinite;
}

/* Pump stopped */
.pump-off circle{
fill:#ff0000;
animation:none;
}

/* Pump error */
.pump-error circle{
fill:yellow;
animation:blink 0.7s infinite;
}

        /* Device popup */
        #devicePopup {
            width: 580px;
            position: absolute;
            background: radial-gradient(circle at top, blue, black);
            border: 2px solid #444;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
            font-size: 12px;
            transform: translateY(-35px);  /* 👈 increase gap from button */

             /* bevel effect */
    box-shadow:
        inset 2px 2px 4px rgba(255,255,255,0.9),
        inset -2px -2px 4px rgba(0,0,0,0.15),
        2px 2px 6px rgba(0,0,0,0.2);
        }

        #devicePopup::after {
           content: "";
           position: absolute;
           bottom: -35px;        /* length of pointer */
           left: 210px;          /* horizontal position */
           width: 0;
           height: 0;
           border-left: 5px solid transparent;   /* narrow pointer */
           border-right: 5px solid transparent;  /* narrow pointer */
           border-top: 35px solid blue;         /* long pointer, matches bottom offset */
        }

 #kvContainer {
    position: absolute;  /* relative to parent container */
    top: 120px;           /* adjust vertical distance from button */
    left: 250px;         /* adjust horizontal distance from button */
}

        #devicePopup table {
    border-collapse: collapse;
    color: black;
    width: 100%;
    table-layout: fixed;
    border-spacing:4px;
    font-size:13px;
}

#devicePopup th{
    padding:6px 3px;
    color:white;
    font-weight:600;
    text-align:center;
    background: linear-gradient(#5c6f91, #2f3f5f);

    border-radius:4px;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,0.5),
        inset -1px -1px 2px rgba(0,0,0,0.4);
}

#devicePopup td{
    padding:6px 8px;
    text-align:center;
    color:#222;

    background: linear-gradient(#ffffff, #e6edf5);

    border-radius:4px;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,0.9),
        inset -1px -1px 2px rgba(0,0,0,0.15);

    font-variant-numeric: tabular-nums;
}

/* Row fill colors for key-value table */

/* Header row */
#devicePopup table tr:nth-child(1) th{
    background:#2c3e50;
    color:white;
}

/* Today values row */
#devicePopup table tr:nth-child(2) td{
    background:#e8f4ff;
}

/* Selected date row */
#devicePopup table tr:nth-child(3) td{
    background:#fff4e6;
}

#popupCloseBtn{
    position:absolute;

    top:5px;
    right:2px;

    z-index:9999;      /* ADD THIS */

    width:15px;
    height:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:white;
    font-size:12px;
    font-weight:bold;

    border-radius:50%;

    background:#cc0000;
}

#popupCloseBtn:hover{
    background:#ff0000;
    transform:scale(1.1);
}

        /* Calendar */
        #calendarContainer {
            position: absolute;
            right: -330px;
            top: 0px;  /* to adjust custom and rest button and calendar */
            width: 320px;
            background: white;
            color: black;
            padding: 10px;
            border: 4px solid #9AFEFF;
            border-radius: 4px;
            z-index: 500;
        }

        #calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr); /* 7 columns for Sun–Sat */
    gap: 2px; /* optional spacing between cells */
    width: 100%; /* take full width of calendarContainer */
    box-sizing: border-box;
}

#calendar div {
    text-align: center;
    padding: 5px 0;
    border: 1px solid #444; /* optional */
    box-sizing: border-box;
}

        .calDate {
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
        }

        .calDate:hover {
            background: #00bfff;
        }

        #calendarHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #calendarHeader button {
            cursor: pointer;
            border: none;
            background: #444;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
        }

        #calendarHeader button:hover {
            background: #00bfff;
        }

        #calendarControls {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

/* LABEL ROW */
.control-labels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
}

/* INPUT ROW */
.control-inputs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
}

/* SELECT STYLE */
.control-inputs select {
    width: 100%;
    padding: 4px;
    text-align: center;
}

   MOBILE RESPONSIVE FLOW DIAGRAM
========================================= */

@media screen and (max-width: 1024px) {

    body{
        overflow-x:hidden;
    }

    /* Rotate diagram for mobile/tablet */
    #plant{

        width: 100vh;          /* use screen height after rotation */
        height: 100vw;

        transform: rotate(90deg);

        transform-origin: top left;

        position: absolute;

        top: 100vh;
        left: 0;

    }

    /* Scale title */
    h2{
        font-size: 22px;
    }

    /* Smaller datetime */
    #currentDateTime{
        font-size: 14px !important;
        top: 5px !important;
        left: 5px !important;
    }

    /* Popup resize */
    #devicePopup{
        position:absolute;
        z-index:1000;
        overflow:visible;
        width: 320px;
        font-size: 10px;
    }

    #devicePopup table{
        font-size: 9px;
    }

    /* Calendar resize */
    #calendarContainer{
        width: 180px;
        right: -190px;
        font-size: 10px;
    }

    /* Control buttons */
    #customControls{
        width: 180px;
        right: 5px;
        top: 5px;
    }

    .button-row button{
        font-size: 10px;
        padding: 4px;
    }

    #languageSwitcher{
        font-size: 10px;
    }

    /* Coordinate box */
    #coords{
        font-size: 9px;
    }
}

        function fmt(val){
    if(val === null || val === undefined || val === '-') return '-';
    return Number(val).toFixed(3);
}

        /* GLOBAL STATE */
let selectedDate = null;
let currentDevice = null;
let customMode = false;

/* DEVICE CLICK */
document.querySelectorAll(".device").forEach(dev => {
    dev.addEventListener("click", function(){

        const circle = this.querySelector("circle");
        let x = circle.getAttribute("cx");
        let y = circle.getAttribute("cy");
        let deviceId = this.id;

        let popup = document.getElementById("devicePopup");

        // If same device clicked → toggle popup
        if(currentDevice === deviceId){

            if(popup.style.display === "block"){
                popup.style.display = "none";
            }else{
                showPopup(x,y);
            }

            return;
        }

        // New device clicked → show popup
        currentDevice = deviceId;
        showPopup(x,y);

    });
});

function showPopup(x,y){

    let popup = document.getElementById("devicePopup");

    let px = parseFloat(x);
    let py = parseFloat(y);

    popup.style.left = (px - 220) + "px";
    popup.style.top  = (py - 120) + "px";

    popup.style.display = "block";

    document.getElementById("popupTable").innerHTML =
    `
    <div style="
    padding:25px;
    text-align:center;
    font-size:16px;
    color:white;
    ">
    Loading...
    </div>
    `;

    loadTable();
}

function hidePopup(){

    let popup = document.getElementById("devicePopup");

    popup.style.display = "none";

    currentDevice = null;
}

/* CLOSE BUTTON */
document.getElementById("popupCloseBtn").onclick = function(e){

    e.stopPropagation();   // prevent click bubbling

    hidePopup();
};


/* CALENDAR DATE SELECTION */
document.getElementById("calendar").addEventListener("change", function(){
    selectedDate = this.value; // yyyy-mm-dd format
    if(currentDevice) loadTable(); // reload table with selected date
});

/* LOAD DEVICE DATA */

function loadTable() {
    if (!currentDevice) return;
    const device = currentDevice;   // freeze device at request time
    const deviceElement = document.getElementById(device);
    const circle = deviceElement.querySelector("circle");
    let datetimeParam = "";

if(customMode && selectedDate){
    const hour = document.getElementById("hourSelect").value;
    const minute = document.getElementById("minuteSelect").value;
    const second = document.getElementById("secondSelect").value;

    datetimeParam = `${selectedDate} ${hour}:${minute}:${second}`;
}

let url = `/device_popup?device=${device}&date=${selectedDate || ''}&datetime=${datetimeParam}`;


    fetch(url)
        .then(res => res.json())
        .then(data => {
        console.log("CUSTOM DATA:", data.custom);

    // ⭐ IMPORTANT: ignore outdated responses
            if (device !== currentDevice) return;
            let today = data.today || {};
            let selected = data.selected || null;

            const fmt = (v) => {
                let num = parseFloat(v);
                return isNaN(num) ? '-' : num.toFixed(3);
            };


    const lang = localStorage.getItem("lang") || "en";

            let html;

if(!customMode){

    // ✅ ORIGINAL TABLE (UNCHANGED)
    const tableClass = (lang === "my") ? "table-my" : "";

html = `
<table class="${tableClass}">
        <tr>
            <th>${translations[lang].table_date}</th>
            <th>${translations[lang].table_latest}</th>
            <th>${translations[lang].table_recent}</th>
            <th>${translations[lang].table_avg30m}</th>
            <th>${translations[lang].table_avg1hr}</th>
            <th>${translations[lang].table_avg1d}</th>
            <th>${translations[lang].table_max}</th>
            <th>${translations[lang].table_min}</th>
        </tr>
        <tr>
            <td>${translations[lang].table_today}</td>
            <td>${fmt(today.latest)}</td>
            <td>${fmt(today.recent)}</td>
            <td>${fmt(today.avg30m)}</td>
            <td>${fmt(today.avg1hr)}</td>
            <td>${fmt(today.avg1d)}</td>
            <td>${fmt(today.max)}</td>
            <td>${fmt(today.min)}</td>
        </tr>
        ${selected ? `<tr>
            <td>${selectedDate ? selectedDate.replace(/-/g,'/') : translations[lang].table_selected}</td>
            <td>${fmt(selected.latest)}</td>
            <td>${fmt(selected.recent)}</td>
            <td>${fmt(selected.avg30m)}</td>
            <td>${fmt(selected.avg1hr)}</td>
            <td>${fmt(selected.avg1d)}</td>
            <td>${fmt(selected.max)}</td>
            <td>${fmt(selected.min)}</td>
        </tr>` : ''}
    </table>
    `;

}else{

    // ✅ CUSTOM TABLE (YOUR REQUIREMENT)

    const hour = document.getElementById("hourSelect").value;
    const minute = document.getElementById("minuteSelect").value;
    const second = document.getElementById("secondSelect").value;

    const custom = data.custom || {};

const value = custom.value !== undefined && custom.value !== null
    ? fmt(custom.value)
    : "-";

const avg = custom.avg !== undefined && custom.avg !== null
    ? fmt(custom.avg)
    : "-";

const max = custom.max !== undefined && custom.max !== null
    ? fmt(custom.max)
    : "-";

const min = custom.min !== undefined && custom.min !== null
    ? fmt(custom.min)
    : "-";

    html = `
    <table>
    <tr>
        <th>${translations[lang].table_date}</th>
        <th>${translations[lang].table_time}</th>
        <th>${translations[lang].table_value}</th>
        <th>${translations[lang].table_avg}</th>
        <th>${translations[lang].table_max}</th>
        <th>${translations[lang].table_min}</th>
    </tr>

    <tr>
        <td>${selectedDate ? selectedDate.replace(/-/g,'/') : '-'}</td>
        <td>${hour}:${minute}:${second}</td>
        <td>${value}</td>
        <td>${avg}</td>
        <td>${max}</td>
        <td>${min}</td>
    </tr>
    </table>
    `;
}

// ✅ ONE render only
document.getElementById("popupTable").innerHTML = html;

// Show popup
popup.style.display = "block";



           // ✅ Adjust pointer to avoid overlapping device
            let popupHeight = popup.offsetHeight;

            // Adjust pointer position
            let after = window.getComputedStyle(popup, "::after");
            // we can also dynamically adjust left if needed
        });
}

        /* CALENDAR SYSTEM */
        let currentDate = new Date();

        function buildCalendar(){
            const cal = document.getElementById("calendar");
            cal.innerHTML = "";

            const monthNames= [ "January","February","March","April","May","June", "July","August","September","October","November","December" ];
            let year = currentDate.getFullYear();
            let month = currentDate.getMonth();

            /* WEEK HEADER */
            const lang = localStorage.getItem("lang") || "en";
            const days = (translations[lang] && translations[lang].days)
            ? translations[lang].days
            : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            days.forEach(d=>{
                let day = document.createElement("div");
                day.innerHTML = "<b>"+d+"</b>";
                day.style.background="#bbb";
                cal.appendChild(day);
            });

            /* FIRST DAY OFFSET */
            let firstDay = new Date(year,month,1).getDay();
            for(let i=0;i<firstDay;i++){
                cal.appendChild(document.createElement("div"));
            }

            /* DAYS IN MONTH */
            let daysInMonth = new Date(year,month+1,0).getDate();
            for(let i=1;i<=daysInMonth;i++){
                let d=document.createElement("div");
                d.className="calDate";
                d.innerText=i;
                d.onclick = function(){
                    selectedDate = year+"-"+String(month+1).padStart(2,'0')+ "-"+String(i).padStart(2,'0');
                    document.querySelectorAll(".calDate").forEach(el=>{ el.style.background=""; el.style.color=""; });
                    d.style.background="#4CAF50";
                    d.style.color="white";
                    if(currentDevice){ loadTable(); }
                };
                cal.appendChild(d);
            }
        }

        /* INITIAL CALENDAR CONTROLS */
        function initCalendarControls(){
            const monthSelect = document.getElementById("monthSelect");
            const yearSelect = document.getElementById("yearSelect");
            const months = [ "Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec" ];

            months.forEach((m,i)=>{
                let option=document.createElement("option");
                option.value=i;
                option.text=m;
                monthSelect.appendChild(option);
            });

            for(let y=2020;y<=2035;y++){
                let option=document.createElement("option");
                option.value=y;
                option.text=y;
                yearSelect.appendChild(option);
            }

            monthSelect.value = currentDate.getMonth();
            yearSelect.value = currentDate.getFullYear();

            monthSelect.addEventListener("change",()=>{ currentDate.setMonth(parseInt(monthSelect.value)); buildCalendar(); });
            yearSelect.addEventListener("change",()=>{ currentDate.setFullYear(parseInt(yearSelect.value)); buildCalendar(); });

    const dd = String(now.getDate()).padStart(2,'0');
    const hh = String(now.getHours()).padStart(2,'0');
    const min = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');

}

// =========================
// MAIN SYSTEM UPDATE (CRITICAL FIX)
// =========================
function updateSystem(){

    Promise.all([
        fetch("/api/valves").then(r=>r.json()),
        fetch("/api/pumps").then(r=>r.json())
    ])
    .then(([valveData, pumpData]) => {

        let valveStates = {};
        let pumpStates = {};

        // =====================
        // RESET ALL PIPES
        // =====================
        document.querySelectorAll(".pipe").forEach(p=>{
            p.style.animation="flow 1s linear infinite";
        });

        // =====================
        // VALVES (UF + RO SEPARATE)
        // =====================
        valveData.forEach(row => {

            // ---------- UF ----------
            if(row.uf_device){
                let id = "V" + parseInt(row.uf_device.replace("XV",""));
                let status = row.uf_value?.status;
                let el = document.getElementById(id);

                if(el){
                    el.classList.remove("valve-on","valve-off","valve-error");

                    if(status === "on"){
                        el.classList.add("valve-on");
                        valveStates[id] = "OPEN";
                    }
                    else if(status === "off"){
                        el.classList.add("valve-off");
                        valveStates[id] = "CLOSED";
                    }
                    else{
                        el.classList.add("valve-error");
                        valveStates[id] = "ERROR";
                    }
                }
            }

            // ---------- RO ----------
            if(row.ro_device){
                let id = "V" + parseInt(row.ro_device.replace("XV",""));
                let status = row.ro_value?.status;
                let el = document.getElementById(id);

                if(el){
                    el.classList.remove("valve-on","valve-off","valve-error");

                    if(status === "on"){
                        el.classList.add("valve-on");
                        valveStates[id] = "OPEN";
                    }
                    else if(status === "off"){
                        el.classList.add("valve-off");
                        valveStates[id] = "CLOSED";
                    }
                    else{
                        el.classList.add("valve-error");
                        valveStates[id] = "ERROR";
                    }
                }
            }

        });

        // =====================
        // PUMPS (UF + RO SEPARATE)
        // =====================
        pumpData.forEach(row => {

            // ---------- UF ----------
            if(row.uf_device){
                let id = row.uf_device;
                let value = row.uf_value;
                let el = document.getElementById(id);

                if(el){
                    el.classList.remove("pump-on","pump-off","pump-error");

                    if(value === null || value === "" || value === "N/A"){
                        el.classList.add("pump-error");
                        pumpStates[id] = "ERROR";
                    }
                    else if(parseFloat(value) > 0){
                        el.classList.add("pump-on");
                        pumpStates[id] = "RUN";
                    }
                    else{
                        el.classList.add("pump-off");
                        pumpStates[id] = "STOP";
                    }
                }
            }

            // ---------- RO ----------
            if(row.ro_device){
                let id = row.ro_device;
                let value = row.ro_value;
                let el = document.getElementById(id);

                if(el){
                    el.classList.remove("pump-on","pump-off","pump-error");

                    if(value === null || value === "" || value === "N/A"){
                        el.classList.add("pump-error");
                        pumpStates[id] = "ERROR";
                    }
                    else if(parseFloat(value) > 0){
                        el.classList.add("pump-on");
                        pumpStates[id] = "RUN";
                    }
                    else{
                        el.classList.add("pump-off");
                        pumpStates[id] = "STOP";
                    }
                }
            }

        });

        // =====================
        // APPLY LOGIC
        // =====================
        applyPumpLogic(pumpStates);
        applyValveLogic(valveStates);

        console.log("PUMPS:", pumpStates);
        console.log("VALVES:", valveStates);


    });
}


// =========================
// AUTO REFRESH
// =========================
setInterval(updateSystem, 2000);
updateSystem();

/* Language Switcher */

function setLanguage(lang){
    const elements = document.querySelectorAll("[data-i18n]");

    elements.forEach(el => {
        const key = el.getAttribute("data-i18n");

        if(typeof translations !== "undefined" &&
           translations[lang] &&
           translations[lang][key]){

            el.innerText = translations[lang][key];
        }
    });

    localStorage.setItem("lang", lang);
}

const savedLang = localStorage.getItem("lang") || "en";

window.addEventListener("DOMContentLoaded", function(){

    setLanguage(savedLang);

    const switcher = document.getElementById("languageSwitcher");

    if(switcher){
        switcher.value = savedLang;

        switcher.addEventListener("change", function(){
    setLanguage(this.value);
    buildCalendar();
});

});
