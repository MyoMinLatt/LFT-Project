{% extends "base.html" %}

{% block title %}RO System{% endblock %}

{% block content %}

<style>

/* ===============================
   BASE
=============================== */
body {
    background:#6E7F80;
    color:white;
}

.graph-box {
    background:white;
    padding:15px;
    border-radius:8px;
    height:100%;
}

.graph-box canvas {
    width:100% !important;
    height:220px !important;
    margin-bottom:15px;
}

.table {
    font-size:12px;
}


/* ===============================
   CLOSE BUTTON
=============================== */
.chart-close{

    position:absolute;

    top:0px;
    right:0px;

    width:20px;
    height:20px;

    border:none;
    border-radius:50%;

    background:#ff4d4d;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    z-index:1000;

    line-height:12px;
    text-align:center;
}

/* hover */
.chart-close:hover{
    background:#cc0000;
}

/* graph box relative */
.graph-box{
    position:relative;
}

.graph-box canvas {
    width:100% !important;
    height:220px !important;
    margin-bottom:15px;
}

.table {
    font-size:12px;
}


/* ===============================
   CHART TITLE
=============================== */
.chart-title{

    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:black;
    margin-bottom:10px;
    margin-top:5px;
}


/* ===============================
   FULL-WIDTH TOP PANEL
=============================== */
.ro-top-panel{
    position: fixed;
    top: 0px;
    left: 0;
    width: 100%;
    z-index: 9999;

    background: rgba(0,0,0,0.7);
    padding: 10px 20px;

    display: flex;
    flex-direction: column;
    gap: 3px;
}

/* ===============================
   TITLE (CENTERED)
=============================== */
.ro-title{
    text-align: center;
    font-size: 40px;
    margin: 0;
}

/* REMOVE THIS (important) */
/* .ro-top-panel h2 { ... } */

/* ===============================
   LANGUAGE (TOP RIGHT)
=============================== */
.ro-top-panel select{
    position: absolute;
    top: 10px;
    right: 20px;
    width: 120px;
}

/* ===============================
   ROW: TIME LEFT / INTERVAL RIGHT
=============================== */
.top-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* TIME LEFT */
.time-box{
    text-align: left;
    font-size: 16px;
    line-height: 1.4;
}

/* INTERVAL RIGHT */
.interval-bar{
    display: flex;
    gap: 5px;
}

.interval-bar button{
    margin: 0;
    padding: 4px 6px;
    font-size: 12px;
}

/* ===============================
   CUSTOM RANGE
=============================== */
.custom-range{
    display: flex;
    gap: 5px;
    justify-content: flex-end;
    flex-wrap: wrap;
}

.custom-range input{
    width: 140px;
}

/* ===============================
   PUSH MAIN CONTENT DOWN
=============================== */
.ro-content{
    margin-top: 170px;  /* adjust if needed */
}

/* ===============================
   PARAMETER PANEL
=============================== */
.param-panel{
    max-width: 200px;
    padding-right: 10px;
}

.parameter-btn {
    width:100%;
    margin-bottom:6px;
    padding: 8px;
    font-size: 14px;
    background-color:#25383C !important;
    color:#ffffff !important;
    border:2px solid #7b2cbf !important;
}

.parameter-btn:hover {
    background-color:#3c096c !important;
}

.parameter-btn.active-parameter {
    background-color:#240046 !important;
    border:2px solid #ffffff !important;
}

/* ===============================
   DEVICE BUTTONS
=============================== */
.device-btn {
    width:100%;
    margin-bottom:4px;
    background-color:#00b894 !important;
    color:white !important;
    border:2px solid #00cec9 !important;
}

.device-btn:hover {
    background-color:#00997a !important;
}

.device-btn.active-device {
    background-color:#00e5ff !important;
    color:#000 !important;
    border:2px solid #ffffff !important;
    font-weight:bold;
}

.device-container{

    margin-left:40px;   /* move device buttons to right */
}

/* ===============================
   ACTIVE DEVICE BUTTON
=============================== */
.device-btn.active-device{

    background:#FFD700 !important;

    color:black !important;

    border:2px solid #FF8C00 !important;

    font-weight:bold;
}

/* ===============================
   ACTIVE INTERVAL
=============================== */
.interval-bar button.active-interval {
    background-color: #0002FF !important;
    color: #ffffff !important;
    border: 2px solid #ffffff !important;
}

.interval-bar button.active-interval:hover {
    background-color: #08305c !important;
}

/* ===============================
   FIXED VALVE BOX (OUTSIDE PANEL)
=============================== */
.fixed-valve{
    position: fixed;

    top: 260px;      /* to adjust up and down below panel */
    right: 20px;

    width: 260px;
    max-height: 300px;

    overflow-y: auto;

    z-index: 9998;

    background: rgba(0,0,0,0.7);
    border: 2px solid #00c8ff;
    border-radius: 10px;
    padding: 10px;

    text-align:center;
}

/* compact table */
.fixed-valve table{
    font-size: 20px;
}

</style>

</div>

   <!-- ✅ VALVE BOX (CORRECT POSITION) -->

        <h6 data-i18n="valve_status">Valves Status</h6>
        <div id="valve-table-container"></div>
</div>



</div>
<hr style="border-color:white;">

<div class="row ro-content">

  <div class="col-md-3 param-panel">

<button class="btn btn-primary parameter-btn" data-param="Pressure (bar)" data-i18n="var_Pressure (bar)">Pressure (bar)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="TMP (bar)" data-i18n="var_TMP (bar)">TMP (bar)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="Temperature (°C)" data-i18n="var_Temperature (°C)">Temperature (°C)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="pH" data-i18n="var_pH">pH</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="Flow (m3/h)" data-i18n="var_Flow">Flow (m<sup>3</sup>/h)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="Conductivity (mS/cm)" data-i18n="var_Conductivity (mS/cm)">Conductivity (mS/cm)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="ORP (mV)" data-i18n="var_ORP (mV)">ORP (mV)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="RO Concentrate (%)" data-i18n="var_RO Concentrate (%)">RO Concentrate (%)</button>
<div class="device-container"></div>

<button class="btn btn-primary parameter-btn" data-param="Pumps" data-i18n="var_Pumps">Pumps</button>
<div class="device-container"></div>

</div>

<div class="col-md-9 graph-panel">
      <div class="row g-3" id="graph-container"></div>
</div>
</div>




<script>

$(document).ready(function(){

let currentInterval = "raw";   // default = raw (real-time)
let charts = {};
let thresholds = {};  // store min/max threshold per device
let customStart = null;
let customEnd = null;
let isCustomActive = false;

const IMG_ON = "/static/images/1.ON.gif";
const IMG_OFF = "/static/images/2.OFF.png";
const IMG_ERROR = "/static/images/3.ERROR.png";

const deviceMap = {
"Pressure (bar)": ["PT008","PT009","PT010","PT011"],
"TMP (bar)": ["RO_TMP"],
"Temperature (°C)": ["TT004"],
"pH": ["pH002","pH003"],
"Flow (m3/h)": ["FT001","FT002"],
"Conductivity (mS/cm)": ["EC002", "EC003"],
"ORP (mV)": ["ORP001"],
"RO Concentrate (%)": ["FCV001"],
"Pumps": ["P007"]
};

// Display name only
const deviceDisplayName = {
    "RO_TMP": "RO TMP"
};

function safeId(name){
    return name.replace(/\s+/g,"_").replace(/[^\w]/g,"");
}

/* CLOCK */
function updateTimes(){
    const now = new Date();
    $("#utc-time").text(now.toISOString().slice(0,19).replace("T"," "));
    const kst = new Date(now.getTime()+9*60*60*1000);
    $("#kst-time").text(kst.toISOString().slice(0,19).replace("T"," "));
}

/* LOAD CHART */

function loadChart(param, device, start=null, end=null){

    $.get("/api/ro-data", {
        parameter:param,
        device:device,
        interval:currentInterval,
        start:start,
        end:end
    }, function(data){

        if(!data || !data.timestamps) return;

        const deviceId = safeId(device);

        if(data.data_time) $("#data-time").text(data.data_time);

        $("#"+deviceId+"_current").text(data.latest ?? "-");
        $("#"+deviceId+"_mean").text(data.mean ?? "-");
        $("#"+deviceId+"_min").text(data.min ?? "-");
        $("#"+deviceId+"_max").text(data.max ?? "-");

        if(data.timestamps.length === 0) return;

        const fullLabels = data.timestamps;
        const fullValues = data.values;

        // 🛑 STOP previous animation if exists
        if(charts[deviceId] && charts[deviceId].animationInterval){
            clearInterval(charts[deviceId].animationInterval);
        }

        // destroy old chart
        if(charts[deviceId]){
            charts[deviceId].destroy();
            delete charts[deviceId];
        }

        const ctx = document.getElementById("chart_"+deviceId);
// DEFINE DATASETS FIRST (CRITICAL FIX)
        let datasets = [
            {
                label: device,
                data: [],
                borderWidth: 2,
                tension: 0.3,
                borderColor: "#12AD2B",   // Parrot Green
                backgroundColor: "transparent"
            },
            {
                label: t("threshold_min"),
                data: [],
                borderColor: "red",
                borderDash: [5,5],
                pointRadius: 0
            },
            {
                label: t("threshold_max"),
                data: [],
                borderColor: "blue",
                borderDash: [5,5],
                pointRadius: 0
            }
        ];

        // CREATE CHART
        charts[deviceId] = new Chart(ctx,{
            type:'line',
            data:{
                labels:[],
                datasets: datasets
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                animation:false
            }
        });

        const windowSize = 300;
        let index = 0;
        const speed = 200;

        const animationInterval = setInterval(function(){

            if(!charts[deviceId]){
                clearInterval(animationInterval);
                return;
            }

            if(index >= fullLabels.length){
                index = 0;  // LOOP BACK (recycle continuously)
            }

            charts[deviceId].data.labels.push(fullLabels[index]);
            const value = fullValues[index];

// main data
charts[deviceId].data.datasets[0].data.push(value);

// threshold logic
const th = thresholds[deviceId];

if(th){
    charts[deviceId].data.datasets[1].data.push(th.min);
    charts[deviceId].data.datasets[2].data.push(th.max);
} else {
    charts[deviceId].data.datasets[1].data.push(null);
    charts[deviceId].data.datasets[2].data.push(null);
}

// maintain window size

            if(charts[deviceId].data.labels.length > windowSize){
                charts[deviceId].data.labels.shift();

                charts[deviceId].data.datasets.forEach(ds => {
                    ds.data.shift();
                 });
            }

            charts[deviceId].update();

            index++;

        }, speed);

        // STORE interval inside chart object
        charts[deviceId].animationInterval = animationInterval;

    });
}

/* INTERVAL BUTTONS */
$(".interval-btn").click(function(){

    $(".interval-btn")
        .removeClass("active-interval")
        .addClass("btn-info");

    $(this)
        .removeClass("btn-info")
        .addClass("active-interval");

    currentInterval = $(this).data("int");   // apply interval

    $("[id^='box_']").each(function(){
        const param  = $(this).data("param");
        const device = $(this).data("device");

        if(isCustomActive){
            loadChart(param, device, customStart, customEnd);
        } else {
            loadChart(param, device);
        }
    });
});

/* APPLY CUSTOM */
$("#applyCustom").click(function(){

    customStart = $("#startTime").val();
    customEnd   = $("#endTime").val();

    if(!customStart || !customEnd){
        alert("Select start & end");
        return;
    }

    isCustomActive = true;

    $("[id^='box_']").each(function(){
        const param  = $(this).data("param");
        const device = $(this).data("device");
        loadChart(param, device, customStart, customEnd);
    });

});

/* RESET */
$("#resetRange").click(function(){

    isCustomActive = false;
    customStart = null;
    customEnd = null;

    currentInterval = "raw";   // back to real-time

    $(".interval-btn")
        .removeClass("active-interval")
        .addClass("btn-info");

    $("#startTime").val("");
    $("#endTime").val("");

    $("[id^='box_']").each(function(){
        const param  = $(this).data("param");
        const device = $(this).data("device");
        loadChart(param, device);
    });

});

/* PARAMETER TOGGLE */
$(".parameter-btn").click(function(){

    let param = $(this).data("param");
    let container = $(this).next(".device-container");

    if(container.children().length>0){
        container.empty();
        return;
    }

   deviceMap[param].forEach(d=>{

    let label = deviceDisplayName[d] || d;

    container.append(`
        <button class="btn btn-secondary device-btn"
            data-param="${param}"
            data-device="${d}">
            ${label}
        </button>
    `);

});

});

/* DEVICE TOGGLE */

/* Translating Key-value names */
function t(key){
    const lang = localStorage.getItem("lang") || "en";

    if(typeof translations !== "undefined" &&
       translations[lang] &&
       translations[lang][key]){
        return translations[lang][key];
    }

    return key;
}

/* DEVICE Data */

$(document).on("click",".device-btn",function(){

    const param  = $(this).data("param");
    const device = $(this).data("device");
    const deviceId = safeId(device);

    if($("#box_"+deviceId).length){

    if(charts[deviceId]){

        if(charts[deviceId].animationInterval){
            clearInterval(charts[deviceId].animationInterval);
        }

        charts[deviceId].destroy();

        delete charts[deviceId];
    }

    $("#box_"+deviceId).remove();

    /* REMOVE ACTIVE COLOR */
    $(this).removeClass("active-device");

    return;
}

/* HIGHLIGHT ACTIVE BUTTON */
$(this).addClass("active-device");

    $("#graph-container").append(`
        <div class="col-md-4" id="box_${deviceId}" data-param="${param}" data-device="${device}">
            <div class="graph-box">
             <button class="chart-close"
                data-device="${device}">
                 ×
            </button>
            <h5 class="chart-title">
                ${deviceDisplayName[device] || device}
            </h5>

             <!-- THRESHOLD UI -->
            <div class="d-flex mb-2" style="gap:5px;">
                <input type="number" id="${deviceId}_min_input" class="form-control form-control-sm" placeholder="${t('table_min')}">
                <input type="number" id="${deviceId}_max_input" class="form-control form-control-sm" placeholder="${t('table_max')}">
                <button class="btn btn-warning btn-sm threshold-btn" data-device="${device}">
                    ${t("threshold_set")}
                </button>
            </div>

                <canvas id="chart_${deviceId}"></canvas>
                <table class="table table-sm mt-2">
                    <tr>
                        <th>${t("table_current")}</th>
                        <th>${t("table_mean")}</th>
                        <th>${t("table_min")}</th>
                        <th>${t("table_max")}</th>
                    </tr>
                    <tr>
                        <td id="${deviceId}_current"></td>
                        <td id="${deviceId}_mean"></td>
                        <td id="${deviceId}_min"></td>
                        <td id="${deviceId}_max"></td>
                    </tr>
                </table>
            </div>
        </div>
    `);

    // First click ALWAYS real-time
    loadChart(param, device);

});

/* ===============================
   CLOSE CHART CONTAINER
=============================== */
$(document).on("click",".chart-close",function(){

    const box = $(this).closest("[id^='box_']");

    const device = box.data("device");

    const deviceId = safeId(device);

    /* destroy chart */
    if(charts[deviceId]){

        if(charts[deviceId].animationInterval){
            clearInterval(charts[deviceId].animationInterval);
        }

        charts[deviceId].destroy();

        delete charts[deviceId];
    }

/* RESET DEVICE BUTTON COLOR */
$(".device-btn").each(function(){

    if($(this).data("device") === device){
        $(this).removeClass("active-device");
    }

});

    /* remove container */
    box.remove();

});



$(document).on("click", ".threshold-btn", function(){

    const device = $(this).data("device");
    const deviceId = safeId(device);
    const btn = $(this);

    // TOGGLE OFF (HIDE)
    if(thresholds[deviceId]){
        delete thresholds[deviceId];

        if(charts[deviceId]){
            charts[deviceId].data.datasets[1].data = [];
            charts[deviceId].data.datasets[2].data = [];
            charts[deviceId].update();
        }

        btn.text(t("threshold_set"));  // back to "Set"
        return;
    }

    // TOGGLE ON (SET)
    const minVal = parseFloat($("#"+deviceId+"_min_input").val());
    const maxVal = parseFloat($("#"+deviceId+"_max_input").val());

    if(isNaN(minVal) || isNaN(maxVal)){
        alert("Enter valid min and max");
        return;
    }

    thresholds[deviceId] = { min: minVal, max: maxVal };

    btn.text(t("threshold_hide"));

});


/* VALVES */
function getValveIcon(v){
    if(!v || !v.status) return `<img src="${IMG_ERROR}" height="40">`;
    if(v.status==="on") return `<img src="${IMG_ON}" height="40">`;
    if(v.status==="off") return `<img src="${IMG_OFF}" height="40">`;
    return `<img src="${IMG_ERROR}" height="40">`;
}

function fetchValves(){
    $.get("/api/ro-valves",function(data){
        if(!Array.isArray(data)) return;
        let html="<table style='width:100%'><tbody>";
        data.forEach(r=>{
            html+=`<tr><td style="font-size:12px;">${r.ro_device}</td>
                   <td>${getValveIcon(r.ro_value)}</td></tr>`;
        });
        html+="</tbody></table>";
        $("#valve-table-container").html(html);
    });
}

setInterval(fetchValves,5000);
fetchValves();

setInterval(updateTimes,1000);
updateTimes();

});


    /* ===============================
   LANGUAGE SWITCH (ADD THIS)
=============================== */

function setLanguage(lang){

    localStorage.setItem("lang", lang);

    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");

        if(translations[lang] && translations[lang][key]){
            el.innerHTML = translations[lang][key];
        }
    });

    // FORCE UPDATE AFTER DOM + CHART READY
    setTimeout(() => {
    updateDynamicLanguage();
    updateChartLanguage();
}, 100);

}

window.addEventListener("DOMContentLoaded", function(){

    const switcher = document.getElementById("languageSwitcher");
    const savedLang = localStorage.getItem("lang") || "en";

    if(switcher){
        switcher.value = savedLang;

        switcher.addEventListener("change", function(){
            setLanguage(this.value);
        });
    }

    setLanguage(savedLang);
});

    // 🔥 UPDATE ALL CHART LEGENDS AFTER LANGUAGE CHANGE
function updateDynamicLanguage(){

    $("[id^='box_']").each(function(){

        const deviceId = $(this).attr("id").replace("box_","");

        // Table headers
        $(this).find("th").eq(0).html(t("table_current"));
        $(this).find("th").eq(1).html(t("table_mean"));
        $(this).find("th").eq(2).html(t("table_min"));
        $(this).find("th").eq(3).html(t("table_max"));

        // Placeholders
        $("#"+deviceId+"_min_input").attr("placeholder", t("table_min"));
        $("#"+deviceId+"_max_input").attr("placeholder", t("table_max"));
    });


}

    function updateChartLanguage(){

    Object.keys(charts).forEach(deviceId => {

        const chart = charts[deviceId];
        if(!chart) return;

        // ⚠️ IMPORTANT: dataset index must match your structure
        if(chart.data.datasets[1]){
            chart.data.datasets[1].label = t("table_min");
        }

        if(chart.data.datasets[2]){
            chart.data.datasets[2].label = t("table_max");
        }

        chart.update();
    });

}
</script>

{% endblock %}
