{% extends "base.html" %}

{% block title %}Analysis{% endblock %}

{% block content %}

<style>

/* ===============================
   BASE
=============================== */
body {
    background:#6E7F80;
    color:white;
}



/* ===============================
   🔥 FULL-WIDTH TOP PANEL
=============================== */
.statistic-top-panel{
    position: fixed;
    top: 0px;
    left: 0;
    width: 100%;
    z-index: 9999;

    background: rgba(0,0,0,0.7);
    padding: 25px 30px;

    display: flex;
    flex-direction: column;
    gap: 3px;
}

/* ===============================
   🔥 TITLE (CENTERED)
=============================== */
.statistic-title{
    text-align: center;
    font-size: 40px;
    margin: 0;
}


/* ===============================
   🔥 LANGUAGE (TOP RIGHT)
=============================== */
.statistic-top-panel select{
    position: absolute;
    top: 10px;
    right: 20px;
    width: 120px;
}

/* ===============================
   🔥 ROW: TIME LEFT / INTERVAL RIGHT
=============================== */
.top-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* TIME LEFT */
.time-box{
    text-align: left;
    font-size: 16px;
    line-height: 1.4;
}




/* ======================================
   Calculation Tables
====================================== */
.calc-title{
    text-align:center;
    color:#32CD32;
    font-size:28px;
    font-weight:bold;
    margin-top:120px;      /* Move title below top panel */
    margin-bottom:20px;
    letter-spacing:1px;
}


.calc-panel{
    background:#ffffff;
    border-radius:12px;
    padding:25px;
    position:relative;
    left:-180px;
    top:20px;
    border:2px solid #0b5ed7;
    box-shadow:0 8px 20px rgba(0,0,0,0.20);
}

.calc-header{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
    margin-bottom:25px;
    padding-right:20px;
}

.calc-header input{
    width:140px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    border:2px solid #0d6efd;
    border-radius:8px;
    color:#003366;
    background:#f8fbff;
}

.calc-header label{
    color:#003366;
    font-size:22px;
    font-weight:bold;
}


.calc-table{
    width:100%;
    border-collapse:collapse;
    font-family:Segoe UI, Arial, sans-serif;
    overflow:hidden;
    border-radius:10px;
}

.calc-table th{
    background:#003366;
    color:white;
    text-align:center;
    font-size:22px;
    font-weight:700;
    padding:14px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    border:1px solid #295f8a;
}

.calc-table td{
    padding:14px;
    font-size:20px;
    border:1px solid #d8d8d8;
    text-align:center;
    font-weight:600;
}

/* First column (Raw water capacity) */
.calc-table td:first-child{
    color:#003366;      /* Change to any colour you like */
    font-size:22px;
    font-weight:700;
}

.calc-table tbody tr:nth-child(even){
    background:#f2f8fc;
}

.calc-table tbody tr:nth-child(odd){
    background:#ffffff;
}

.calc-table tbody tr:hover{
    background:#d7f0ff;
    transition:0.3s;
}
</style>


<div class="statistic-top-panel">


    <!-- TITLE -->
    <h2 class="statistic-title text-center" data-i18n="statistical-analysis">Statistical Analysis</h2>

    <!-- LANGUAGE -->
    <select id="languageSwitcher">
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="my">Myanmar</option>
        <option value="vi">Vietnamese</option>
        <option value="mn">Mongolian</option>
    </select>

    <!-- 🔥 ROW: TIME (LEFT) + INTERVAL (RIGHT) -->
<div class="top-row">

    <!-- LEFT: TIME -->
    <div class="time-box">
        <div>UTC: <span id="utc-time"></span></div>
        <div>KST: <span id="kst-time"></span></div>
        <div>

            <span id="data-time" style="font-weight:bold; color:#00ffff;"></span>
        </div>
    </div>


</div>   <!-- closes .top-row -->

</div>   <!-- closes .statistic-top-panel -->

<hr style="border-color:white;">

    <div class="row statistic-content"></div>

        <div class="col-md-3 param-panel"> </div>
</div>



<!-- =========================================
     Processing Time Calculator
========================================= -->
<h3 class="calc-title"
    style="margin-top:120px;"
    data-i18n="uf_treatment_volume_estimation">
    UF Treatment Volume Estimation
</h3>

<div class="row mt-4">
    <div class="col-md-9 offset-md-3">

<div class="calc-panel">

    <div class="calc-header">

        <label data-i18n="average_treatment_flow_rate">
            <strong>>Average treatment flow rate</strong>
        </label>

        <input
            type="number"
            id="flowRate"
            class="form-control"
            step="0.01"
            value="15.01">

        <label data-i18n="ton_per_hour"><strong>Ton/hr</strong> </label>

    </div>

    <table class="calc-table">

        <thead>
            <tr>
                <th data-i18n="raw_water_capacity"> Raw water capacity (X) </th>
                <th data-i18n="estimated_processing_time"> Estimated processing time (T) </th>
                <th data-i18n="uf_treatment_volume"> UF Treatment volume (Y) </th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>5 Ton</td>
                <td id="time5"></td>
                <td id="uf5"></td>
            </tr>

            <tr>
                <td>10 Ton</td>
                <td id="time10"></td>
                <td id="uf10"></td>
            </tr>

            <tr>
                <td>15 Ton</td>
                <td id="time15"></td>
                <td id="uf15"></td>
            </tr>

            <tr>
                <td>20 Ton</td>
                <td id="time20"></td>
                <td id="uf20"></td>
            </tr>

            <tr>
                <td>25 Ton</td>
                <td id="time25"></td>
                <td id="uf25"></td>
            </tr>

            <tr>
                <td>30 Ton</td>
                <td id="time30"></td>
                <td id="uf30"></td>
            </tr>

        </tbody>

    </table>

    </div>
    </div>
    </div>
</div>




<script>

/* ===============================
   CLOCK
=============================== */

function updateTimes() {

    const now = new Date();

    document.getElementById("utc-time").textContent =
        now.toISOString().slice(0,19).replace("T"," ");

    const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);

    document.getElementById("kst-time").textContent =
        kst.toISOString().slice(0,19).replace("T"," ");

}

document.addEventListener("DOMContentLoaded", function () {

    updateTimes();

    setInterval(updateTimes, 1000);

});


//* Calculation in Table *//

document.addEventListener("DOMContentLoaded", function () {

    const capacities = [5, 10, 15, 20, 25, 30];

    function updateProcessingTime() {

        const flow = parseFloat(document.getElementById("flowRate").value);

        capacities.forEach(function(cap) {

            const timeCell = document.getElementById("time" + cap);
            const ufCell = document.getElementById("uf" + cap);

            if (!timeCell || !ufCell) return;

            if (isNaN(flow) || flow <= 0) {

                timeCell.innerHTML = "-";
                ufCell.innerHTML = "-";

            } else {

                const minutes = (60 * cap) / flow;

                timeCell.innerHTML =
                    '<span style="color:#0d6efd;font-weight:bold;">'
                    + Math.round(minutes)
                    + ' min</span>';

                const ufVolume = (0.84 * minutes) / 60;

                ufCell.innerHTML =
                    '<span style="color:#198754;font-weight:bold;">'
                    + ufVolume.toFixed(2)
                    + ' Ton</span>';

            }

        });

    }

    document.getElementById("flowRate")
        .addEventListener("input", updateProcessingTime);

    updateProcessingTime();

});

function applyLanguage(lang) {
    document.querySelectorAll("[data-i18n]").forEach(function(element){
        const key = element.dataset.i18n;
        if (translations[lang] && translations[lang][key]) {
            element.innerHTML = translations[lang][key];
        }
    });
}

document.addEventListener("DOMContentLoaded", function () {

    const savedLang = localStorage.getItem("language") || "en";

    const selector = document.getElementById("languageSwitcher");

    if (selector) {

        selector.value = savedLang;

        selector.addEventListener("change", function () {

            localStorage.setItem("language", this.value);

            applyLanguage(this.value);

        });

    }

    applyLanguage(savedLang);

});





</script>

{% endblock %}
