<script>
/* =========================
   GLOBALS
========================= */
let thresholds = JSON.parse(localStorage.getItem("thresholds") || "{}");
let alarmHigh = 0;   // 🔴 above max
let alarmLow  = 0;   // 🟡 below min

let highDevices = [];   // 🔴 above max
let lowDevices  = [];   // 🟡 below min
let lastAlertSignature = ""; // prevent duplicate sending
let lastAlertTime = 0;   // 🔥 REQUIRED FIX


let alarmAudio = new Audio("{{ url_for('static', filename='voice/alert-alarm-1005.wav') }}");
alarmAudio.loop = true;
let soundEnabled = true;
soundEnabled = JSON.parse(localStorage.getItem("soundEnabled") ?? "true");
document.getElementById("soundToggle").textContent = soundEnabled ? "🔊" : "🔇";

document.addEventListener("click", () => {
    alarmAudio.play().then(() => {
        alarmAudio.pause();
        alarmAudio.currentTime = 0;
    }).catch(()=>{});
}, { once: true });

document.getElementById("soundToggle").addEventListener("click", function () {

    // 🔁 Toggle state
    soundEnabled = !soundEnabled;

    // 🔥 SAVE STATE (ADD THIS LINE HERE)
    localStorage.setItem("soundEnabled", JSON.stringify(soundEnabled));

    if (!soundEnabled) {
        // TURN OFF SOUND
        alarmAudio.pause();
        alarmAudio.currentTime = 0;
        this.textContent = "🔇";
    } else {
        // 🔊 TURN ON SOUND
        this.textContent = "🔊";

        // 🔥 play immediately if alarm exists
        let total = alarmHigh + alarmLow;
        if(total > 0){
            alarmAudio.play().catch(()=>{});
        }
    }

});
/* =========================
   THRESHOLD CHECK
========================= */
function checkThreshold(device, value){

    if(!device) return "";

    let t = thresholds[device];
    if(!t) return "";

    let num = parseFloat(value);
    if(isNaN(num)) return "";

    // 🔴 BELOW MIN
    if(typeof t.min === "number" && !isNaN(t.min)){
        if(num < t.min){
            alarmLow++;

            if (!lowDevices.some(d => d.name === device)) {
                lowDevices.push({ name: device, value: num });
            }

            return "blink-low";
        }
    }

    // 🔴 ABOVE MAX
    if(typeof t.max === "number" && !isNaN(t.max)){
        if(num > t.max){
            alarmHigh++;

            if (!highDevices.some(d => d.name === device)) {
                highDevices.push({ name: device, value: num });
            }

            return "blink-high";
        }
    }

    return "";
}

   /* ===============================
   🔥 TRANSLATE VARIABLE FUNCTION (ADD HERE)
=============================== */
function translateVariable(name){
    const lang = localStorage.getItem("lang") || "en";

    // normalize string
    let key = name.replace("m³", "m<sup>3</sup>");

    if(translations[lang] && translations[lang]["var_" + key]){
        return translations[lang]["var_" + key];
    }

    console.log("Translate:", name, "=>", "var_" + key);
    return name;
}

            /* =========================

/* ===============================
   VALVE ICON FUNCTION (ADDED)
=============================== */
function getValveIcon(value){
    if(!value || !value.status){
        return `<img src="{{ url_for('static', filename='images/3.ERROR.png') }}" height="40">`;
    }
    if(value.status === "on"){
        return `<img src="{{ url_for('static', filename='images/1.ON.gif') }}" height="40">`;
    }
    if(value.status === "off"){
        return `<img src="{{ url_for('static', filename='images/2.OFF.png') }}" height="45">`;
    }
    return `<img src="{{ url_for('static', filename='images/3.ERROR.png') }}" height="40">`;
}



/* ===============================
   VALVE TABLE (FIXED)
=============================== */
function fetchValves(){

    $.get("/api/valves?t=" + new Date().getTime(), function(data){

        if(!Array.isArray(data)){
            console.log("Valve API error");
            return;
        }

        let ufList = [];
        let roList = [];

        // Separate UF and RO valves
        data.forEach(function(row){

            if(row.uf_device){
                ufList.push({
                    device: row.uf_device,
                    value: row.uf_value
                });
            }

            if(row.ro_device){
                roList.push({
                    device: row.ro_device,
                    value: row.ro_value
                });
            }

        });

        /* ==========================
           BUILD UF TABLE (2 columns)
        ========================== */

        let ufHtml = `
        <div style="margin-bottom:15px;">
        <div class="text-success fw-bold text-center mb-2" data-i18n="uf_system">UF System</div>
        <table style="width:100%"><tbody>`;

        let half = Math.ceil(ufList.length / 2);

        for(let i = 0; i < half; i++){

            ufHtml += "<tr>";

            // First column
            let left = ufList[i];
            ufHtml += `
            <td>
                <div class="pair-box uf-box">
                    <span class="device-text">${left.device}</span>
                    <span class="value-text">
                        ${getValveIcon(left.value)}
                    </span>
                </div>
            </td>`;

            // Second column (if exists)
            let right = ufList[i + half];
            if(right){
                ufHtml += `
                <td>
                    <div class="pair-box uf-box">
                        <span class="device-text">${right.device}</span>
                        <span class="value-text">
                            ${getValveIcon(right.value)}
                        </span>
                    </div>
                </td>`;
            } else{
                ufHtml += `<td></td>`;
            }

            ufHtml += "</tr>";
        }

        ufHtml += "</tbody></table></div>";


        /* ==========================
           BUILD RO TABLE (1 column)
        ========================== */

        let roHtml = `
        <div>
        <div class="text-warning fw-bold text-center mb-2" data-i18n="ro_system">RO System</div>
        <table style="width:100%"><tbody>`;

        roList.forEach(function(item){

            roHtml += `
            <tr>
                <td>
                    <div class="pair-box ro-box">
                        <span class="device-text">${item.device}</span>
                        <span class="value-text">
                            ${getValveIcon(item.value)}
                        </span>
                    </div>
                </td>
            </tr>`;
        });

        roHtml += "</tbody></table></div>";

        $("#valve-table-container").html(ufHtml + roHtml);

    });
}

<script>
/* =========================
   ALARM
========================= */
function updateAlarm(){

    let total = alarmHigh + alarmLow;

    // 🔴 High alarm button
    $("#alarmHighBtn").text("🔴 " + alarmHigh);

    // 🟡 Low alarm button
    $("#alarmLowBtn").text("🟡 " + alarmLow);

    if(total > 0){
        if(soundEnabled && alarmAudio.paused){
            alarmAudio.play().catch(err => {
                console.warn("Audio blocked:", err);
});
        }
    }else{
        alarmAudio.pause();
        alarmAudio.currentTime = 0;
    }
}

function triggerWarning(){

    // nothing abnormal
    if(highDevices.length === 0 && lowDevices.length === 0){
        lastAlertSignature = "";
        return;
    }

    // ===== COOLDOWN (🔥 ADD THIS BLOCK)
    let now = Date.now();
    let cooldown = 60000; // 60 seconds

    if(now - lastAlertTime < cooldown){
        return; // ⛔ prevent spam
    }

    // create signature (avoid duplicate sending)
    let signature = JSON.stringify({highDevices, lowDevices});

    if(signature === lastAlertSignature){
        return;
    }

    lastAlertSignature = signature;
    lastAlertTime = now;   // 🔥 IMPORTANT

    // ===== BUILD MESSAGE =====
    let highList = highDevices.map(d => `${d.name}: ${d.value}`).join(", ");
    let lowList  = lowDevices.map(d => `${d.name}: ${d.value}`).join(", ");

    let message = {
        high_count: highDevices.length,
        high_list: highList,
        low_count: lowDevices.length,
        low_list: lowList
    };

    console.log("🚨 Sending alert:", message);

    // ===== SEND TO BACKEND =====
    $.ajax({
        url: "/api/send-alert",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(message),
        success: function(){
            console.log("✅ Alert sent");
        },
        error: function(err){
            console.error("❌ Alert failed", err);
        }
    });
}

/* =========================
   THRESHOLD UI
========================= */
$("#toggleThreshold").click(function(){
    $("#thresholdPanel").toggle();

function getAllDevices(){
    let devices = new Set();

    $(".device-text").each(function(){

    let name = $(this).text().trim();

    if(!name) return;

    // EXCLUDE valves (XV series)
    if(name.startsWith("XV")) return;

    devices.add(name);
});

    let arr = Array.from(devices);

    // 🔥 SORT LOGIC
    arr.sort((a, b) => {

        // extract text + number
        let aMatch = a.match(/^([A-Za-z ]+)(\d+)?$/);
        let bMatch = b.match(/^([A-Za-z ]+)(\d+)?$/);

        let aPrefix = aMatch ? aMatch[1].trim() : a;
        let bPrefix = bMatch ? bMatch[1].trim() : b;

        let aNum = aMatch && aMatch[2] ? parseInt(aMatch[2]) : 0;
        let bNum = bMatch && bMatch[2] ? parseInt(bMatch[2]) : 0;

        // 🔹 First sort by prefix
        if(aPrefix < bPrefix) return -1;
        if(aPrefix > bPrefix) return 1;

        // 🔹 Then sort by number
        return aNum - bNum;
    });

    return arr;
}

function renderThresholdUI(){

    let devices = getAllDevices();
    let html="";

    devices.forEach(dev=>{

        let t = thresholds[dev] || {};

        html+=`
        <div style="display:flex; gap:10px; margin-bottom:5px;">

            <div onclick="toggleDevice('${dev}')" style="cursor:pointer; width:100px;">
                ▶ ${dev}
            </div>

            <div id="dev_${dev}" style=" display:none; align-items:center; gap:5px; white-space:nowrap;">

                Min <input type="number"
                    value="${t.min ?? ""}"
                    style="width:60px; padding:2px; font-size:0.8rem;"
                    onchange="saveThreshold('${dev}','min',this.value)">

                Max <input type="number"
                    value="${t.max ?? ""}"
                    style="width:60px; padding:2px; font-size:0.8rem;"
                    onchange="saveThreshold('${dev}','max',this.value)">

            </div>

        </div>`;
    });

    $("#thresholdPanel").html(html);
}

function toggleDevice(dev){

    let el = $("#dev_" + dev);

    if(el.is(":visible")){
        el.hide();
    }else{
        el.css("display","flex");   // 🔥 KEY CHANGE
    }
}


/* Save threshold */

function saveThreshold(dev, type, val){

    if(!thresholds[dev]) thresholds[dev] = {};

    // 🔥 if input is empty → REMOVE threshold
    if(val === "" || val === null){

        delete thresholds[dev][type];

        // 🔥 if both min & max removed → delete device completely
        if(!thresholds[dev].min && !thresholds[dev].max){
            delete thresholds[dev];
        }

    } else {

        thresholds[dev][type] = parseFloat(val);
    }

    localStorage.setItem("thresholds", JSON.stringify(thresholds));
}
